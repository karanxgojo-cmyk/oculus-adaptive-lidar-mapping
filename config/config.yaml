# OCULUS: Perception-Guided Adaptive 2.5D LiDAR Mapping Configuration

system:
  project_name: "OCULUS"
  subtitle: "Perception-Guided Adaptive 2.5D LiDAR Mapping"
  version: "2.0.0-research"
  model_mode: "DEMO/SIMULATED"  # Will be 'REAL' if pretrained weights are loaded
  device: "cpu"

sensor:
  lidar_type: "Velodyne HDL-64E (Simulated)"
  min_range: 0.5    # meters
  max_range: 80.0   # meters
  min_z: -3.0       # meters
  max_z: 6.0        # meters
  voxel_size: 0.08  # downsample voxel

grid:
  bounds:
    x_min: -40.0
    x_max: 60.0
    y_min: -40.0
    y_max: 40.0
  
  # Hierarchical Level Definitions (Levels 0 to 4)
  # Color Palette: RED = FINE, YELLOW = MEDIUM, BLUE = COARSE
  levels:
    0:
      name: "Ultra Fine"
      resolution: 0.05  # 5 cm
      color: "#ef4444"  # Red (Fine)
    1:
      name: "Fine"
      resolution: 0.10  # 10 cm
      color: "#f59e0b"  # Amber / Orange
    2:
      name: "Medium"
      resolution: 0.20  # 20 cm
      color: "#eab308"  # Yellow (Medium)
    3:
      name: "Coarse"
      resolution: 0.40  # 40 cm
      color: "#0284c7"  # Light Blue
    4:
      name: "Ultra Coarse"
      resolution: 0.80  # 80 cm
      color: "#1e40af"  # Deep Blue (Coarse)

  # Base Distance-to-Level Mapping (radial distance from vehicle)
  distance_zones:
    - max_dist: 10.0
      base_level: 0     # 5 cm (Red)
    - max_dist: 25.0
      base_level: 1     # 10 cm (Orange)
    - max_dist: 50.0
      base_level: 2     # 20 cm (Yellow)
    - max_dist: 80.0
      base_level: 3     # 40 cm (Light Blue)
    - max_dist: 999.0
      base_level: 4     # 80 cm (Deep Blue)

importance_weights:
  distance: 0.25
  semantic: 0.30
  motion: 0.20
  uncertainty: 0.10
  geometry: 0.15
  path_relevance: 0.25

refinement_thresholds:
  refine_to_level_0: 0.75  # importance >= 0.75 -> refine to 5 cm (Red)
  refine_to_level_1: 0.55  # importance >= 0.55 -> refine to 10 cm
  refine_to_level_2: 0.35  # importance >= 0.35 -> refine to 20 cm (Yellow)
  coarsen_threshold: 0.25  # importance < 0.25 -> merge/coarsen back to base level

semantics:
  classes:
    0: { name: "Unknown",      color: "#64748b", base_importance: 0.10 }
    1: { name: "Drivable",     color: "#10b981", base_importance: 0.05 }
    2: { name: "Non-Drivable", color: "#475569", base_importance: 0.20 }
    3: { name: "Obstacle",     color: "#f59e0b", base_importance: 0.70 }
    4: { name: "Vehicle",      color: "#3b82f6", base_importance: 0.85 }
    5: { name: "Pedestrian",   color: "#ef4444", base_importance: 0.98 }
    6: { name: "Pole",         color: "#a855f7", base_importance: 0.40 }
    7: { name: "Wall",         color: "#0ea5e9", base_importance: 0.35 }

risk:
  safe_threshold: 0.30
  caution_threshold: 0.55
  warning_threshold: 0.75
  corridor_width: 3.5
  corridor_length: 30.0

dashboard:
  host: "127.0.0.1"
  port: 8050
  auto_open_browser: true
  max_points_display: 25000
  stream_interval_ms: 600  # Interval between streaming frames
